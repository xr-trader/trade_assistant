[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"  # 兼容直接 pip install

[project]
name = "trade_assistant"
version = "0.1.0"
description = "量化交易订单管理系统"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=1.10.0,<3.0.0",
    "uvicorn>=0.20.0",
    "gunicorn>=20.0.0",
    "python-jose>=3.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "requests>=2.28.0",
    "websockets>=10.0",
    "schedule>=1.0.0",
    "python-dateutil>=2.8.0",
]
